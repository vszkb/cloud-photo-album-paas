<div class="container py-4">
  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary"><span class="visually-hidden">Betöltés…</span></div>
    </div>
  } @else if (error() || !photo()) {
    <div class="text-center py-5 text-muted">
      <i class="bi bi-exclamation-triangle display-1"></i>
      <p class="mt-3">A kép nem található.</p>
      <a routerLink="/" class="btn btn-primary btn-sm mt-2"><i class="bi bi-arrow-left me-1"></i>Vissza</a>
    </div>
  } @else {
    @if (photo(); as p) {
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow border-0">
            <img [src]="p.imagePath" [alt]="p.name" class="card-img-top">
            <div class="card-body">
              <h4 class="card-title mb-2">{{ p.name }}</h4>
              <p class="text-muted mb-3">
                <i class="bi bi-calendar3 me-1"></i>{{ p.uploadDate | date:'yyyy-MM-dd HH:mm' }}
              </p>
              <div class="d-flex gap-2">
                <a routerLink="/" class="btn btn-outline-secondary btn-sm">
                  <i class="bi bi-arrow-left me-1"></i>Vissza
                </a>
                <button class="btn btn-outline-primary btn-sm" (click)="copyLink()">
                  @if (copied()) {
                    <i class="bi bi-check-lg me-1"></i>Másolva!
                  } @else {
                    <i class="bi bi-clipboard me-1"></i>Link másolása
                  }
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  }
</div>
