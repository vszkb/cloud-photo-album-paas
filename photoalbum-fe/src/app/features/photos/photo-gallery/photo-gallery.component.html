<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
    <h2 class="mb-0 fw-semibold"><i class="bi bi-images me-2"></i>Galéria</h2>
    <div class="d-flex align-items-center gap-2">
      <select class="form-select form-select-sm" style="width:auto"
              [ngModel]="sortBy()" (ngModelChange)="sortBy.set($event); onSortChange()">
        <option value="date">Dátum</option>
        <option value="name">Név</option>
      </select>
      <select class="form-select form-select-sm" style="width:auto"
              [ngModel]="sortDirection()" (ngModelChange)="sortDirection.set($event); onSortChange()">
        <option value="desc">Csökkenő</option>
        <option value="asc">Növekvő</option>
      </select>
    </div>
  </div>

  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary"><span class="visually-hidden">Betöltés…</span></div>
    </div>
  } @else {
    <app-photo-grid [photos]="photos()" emptyText="Még nincs feltöltött kép." />
  }
</div>
