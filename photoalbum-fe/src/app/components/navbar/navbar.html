<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="bi bi-camera-fill me-2"></i>Fényképalbum
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-images me-1"></i>Galéria
          </a>
        </li>
        @if (auth.isAuthenticated()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/my-photos" routerLinkActive="active">
              <i class="bi bi-person-square me-1"></i>Saját képeim
            </a>
          </li>
        }
      </ul>
      <div class="d-flex align-items-center gap-2">
        @if (auth.isAuthenticated()) {
          <span class="text-light small me-2">
            <i class="bi bi-person-circle me-1"></i>{{ auth.userEmail() }}
          </span>
          <button class="btn btn-outline-light btn-sm" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>Kijelentkezés
          </button>
        } @else {
          <a class="btn btn-outline-light btn-sm" routerLink="/login">
            <i class="bi bi-box-arrow-in-right me-1"></i>Bejelentkezés
          </a>
          <a class="btn btn-light btn-sm" routerLink="/register">
            <i class="bi bi-person-plus me-1"></i>Regisztráció
          </a>
        }
      </div>
    </div>
  </div>
</nav>
