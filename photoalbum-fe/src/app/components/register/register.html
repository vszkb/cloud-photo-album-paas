<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">
            <i class="bi bi-person-plus me-2"></i>Regisztráció
          </h3>
          @if (success()) {
            <div class="alert alert-success py-2">
              Sikeres regisztráció! Átirányítás a bejelentkezéshez...
            </div>
          }
          @if (error()) {
            <div class="alert alert-danger py-2">{{ error() }}</div>
          }
          <form (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">E-mail cím</label>
              <input type="email" class="form-control"
                     [ngModel]="email()" (ngModelChange)="email.set($event)"
                     name="email"
                     placeholder="pelda@email.hu" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jelszó</label>
              <input type="password" class="form-control"
                     [ngModel]="password()" (ngModelChange)="password.set($event)"
                     name="password"
                     placeholder="••••••••" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jelszó megerősítése</label>
              <input type="password" class="form-control"
                     [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"
                     name="confirmPassword"
                     placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100"
                    [disabled]="loading() || !email() || !password() || !confirmPassword()">
              @if (loading()) {
                <span class="spinner-border spinner-border-sm me-1"></span>
              }
              Regisztráció
            </button>
          </form>
          <div class="text-center mt-3">
            <small class="text-muted">
              Már van fiókod?
              <a routerLink="/login" class="text-decoration-none">Bejelentkezés</a>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
